const dayStart=x=>new Date(x+"T00:00:00"),diff=(a,b)=>Math.round((a-b)/864e5);
const nextOcc=e=>{const t=dayStart(TD()),d=dayStart(e.date);if(!e.yearly)return d;let n=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());return n};
const photoUrl=u=>{if(!u)return"";const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`:u};
const badge=()=>{const n=streak(days);return "🔥 "+n+(n>=60?" 🥇":n>=30?" 🥈":n>=7?" 🥉":"")};
const topbar=un=>`<div class="top"><button class="x" data-tab="hub">🏠</button><span class="brand">Our Life ❤️</span><span><button class="x" data-act="theme">${document.documentElement.dataset.th==="light"?"🌙":"☀️"}</button><button class="x" data-tab="chat">💬${un?`<b class="bdg">${un>99?"99+":un}</b>`:""}</button><button class="x" data-tab="set">⚙️</button></span></div>`;
async function saveDoc(c,data){if(ed&&L[c].some(x=>x.id===ed))await updateDoc(doc(db,c,ed),{...data,upd:me.name});else await addDoc(collection(db,c),{...data,by:me.name,t:Date.now()});ed=null;render(true)}
const canc=cur=>cur.id?'<button class="b s" data-act="cancel">Cancel</button>':"";
const rowBtn=(c,id)=>`<div class="r"><button class="b s" data-ed="${id}">Edit</button><button class="b s" data-rm="${c}:${id}">Delete</button></div>`;
function hubV(){const wc=(days[TD()]||{}).wc||0,t0=dayStart(TD()),st=L.dates.filter(x=>x.cat==="Relationship start").sort((a,b)=>a.date<b.date?-1:1)[0];
 const up=L.dates.map(e=>({e,n:diff(nextOcc(e),t0)})).filter(x=>x.n>=0).sort((a,b)=>a.n-b.n)[0];
 return `<div class="r1">${av(U.uid,me.name,52)}<h1 class="glow" style="margin:0">Welcome, ${esc(me.name)}</h1></div><div class="mut">Where to today?</div>
 <button class="hub" data-tab="home"><span class="emo">🇩🇪</span><span class="tt">German Learning</span><span class="mut">Today: ${wc}/20 words · ${badge()}</span></button>
 <button class="hub love" data-tab="dates"><span class="emo">❤️</span><span class="tt">Our Relationship</span><span class="mut">${st?diff(t0,dayStart(st.date))+" days together":"Add your start date"}${up?" · "+esc(up.e.title)+(up.n===0?" today 🎉":" in "+up.n+" days"):""}</span></button>
 ${cdw()}<div class="c"><h2>Recent activity</h2>${feed.slice(0,5).map(f=>`<div class="w r1">${av(f.uid,f.name,28)}<div><b>${esc(f.name)}</b> ${esc(f.text)}</div></div>`).join("")||'<div class="mut">Nothing yet.</div>'}</div>`}
function setV(){const ns="Notification" in window?Notification.permission:"not supported";return `<h1 class="glow">Settings</h1><div class="c"><h2>Theme</h2><div class="r"><button class="b ${theme==="dark"?"":"s"}" data-th="dark">🌙 Dark</button><button class="b ${theme==="light"?"":"s"}" data-th="light">☀️ Light</button><button class="b ${theme==="auto"?"":"s"}" data-th="auto">Auto</button></div></div><div class="c"><h2>Display name</h2><input id="sn" value="${esc(me.name)}"><button class="b" data-act="savename">Save</button><div class="mut">Profile photos: saimoon.png and nadiya.png in the repo root.</div></div><div class="c"><h2>Notifications</h2><div class="mut">Status: ${ns}</div><button class="b s" data-act="notif">🔔 Enable notifications</button></div><div class="c"><h2>Backup</h2><div class="mut">Save a copy of your words, progress and shared memories.</div><button class="b" data-act="bk">⬇️ Download backup</button><button class="b s" data-act="rs">⬆️ Restore from backup</button><input id="bkf" type="file" accept=".json,application/json" hidden></div>${devCard()}<div class="c"><h2>Password</h2><input id="pwc" type="password" autocomplete="current-password"><input id="pwn" type="password" autocomplete="new-password"><button class="b" data-act="pwchg">Change password</button><button class="b s" data-act="pwmail">✉️ Email me a reset link</button></div>${deferred?'<button class="b s" data-act="install">📲 Install on phone</button>':""}<button class="b s" data-act="out">Logout</button>`}
function datesV(){const cur=L.dates.find(x=>x.id===ed)||{},t0=dayStart(TD()),st=L.dates.filter(x=>x.cat==="Relationship start").sort((a,b)=>a.date<b.date?-1:1)[0];
 const items=L.dates.map(e=>({e,n:diff(nextOcc(e),t0)})).sort((a,b)=>(a.n<0)-(b.n<0)||(a.n<0?b.n-a.n:a.n-b.n));
 return `<h1 class="glow">Our dates</h1><div class="c" style="text-align:center">${st?`<div class="beat">❤️</div><div class="big" style="margin:4px">${diff(t0,dayStart(st.date))}</div><div class="mut">days together · since ${st.date}</div>`:'<div class="mut">Add a "Relationship start" date to see your days together.</div>'}</div>
 ${cdw()}<div class="c"><h2>${cur.id?"Edit":"Add"} a date</h2><input id="dt" placeholder="Title" value="${esc(cur.title)}"><input id="dd" type="date" value="${esc(cur.date)}"><select id="dc">${DCATS.map(c=>`<option ${cur.cat===c?"selected":""}>${c}</option>`).join("")}</select><label class="t"><input type="checkbox" id="dy" ${cur.yearly?"checked":""}><span>Repeats every year</span></label><input id="dn" placeholder="Description (optional)" value="${esc(cur.desc)}"><button class="b" data-act="savedate">Save</button>${canc(cur)}</div>
 ${items.map(({e,n})=>`<div class="c"><div class="sp"><b>${esc(e.title)}</b><span class="tag">${esc(e.cat)}</span></div><div class="mut">${e.date}${e.yearly?" · yearly":""}</div>${e.desc?`<div>${esc(e.desc)}</div>`:""}<div class="mut">${n===0?"Today 🎉":n>0?"In "+n+" days":Math.abs(n)+" days ago"}</div>${rowBtn("dates",e.id)}</div>`).join("")||'<div class="c mut">No dates yet.</div>'}`}
function memV(){const cur=L.mems.find(x=>x.id===ed)||{},ms=[...L.mems].sort((a,b)=>a.date<b.date?1:-1);
 return `<h1 class="glow">Memories</h1><div class="c"><h2>${cur.id?"Edit":"Add"} a memory</h2><input id="mt" placeholder="Title" value="${esc(cur.title)}"><input id="md" type="date" value="${esc(cur.date)}"><input id="mp" placeholder="Photo link (public Google Drive link)" value="${esc(cur.photo)}"><textarea id="mn" rows="3" placeholder="Description">${esc(cur.desc)}</textarea><button class="b" data-act="savemem">Save</button>${canc(cur)}</div>
 <div class="r"><button class="b ${memView==="grid"?"":"s"}" data-mv="grid">Gallery</button><button class="b ${memView==="line"?"":"s"}" data-mv="line">Timeline</button></div>
 <div class="${memView==="grid"?"grid":"tl"}" style="margin-top:12px">${ms.map(m=>`<div class="c">${m.photo?`<img class="ph" loading="lazy" referrerpolicy="no-referrer" src="${esc(photoUrl(m.photo))}" alt="" onerror="this.replaceWith(document.createTextNode('Photo unavailable'))">`:""}<b>${esc(m.title)}</b><div class="mut">${m.date}</div>${m.desc?`<div>${esc(m.desc)}</div>`:""}${rowBtn("mems",m.id)}</div>`).join("")||'<div class="c mut">No memories yet.</div>'}</div>`}
function letV(){const cur=L.letters.find(x=>x.id===ed)||{},ls=[...L.letters].sort((a,b)=>a.date<b.date?1:-1);
 return `<h1 class="glow">Letters</h1><div class="c"><h2>${cur.id?"Edit":"Write"} a letter</h2><input id="lt" placeholder="Title" value="${esc(cur.title)}"><input id="ld2" type="date" value="${esc(cur.date||TD())}"><textarea id="lb" rows="7" placeholder="Dear…">${esc(cur.body)}</textarea><button class="b" data-act="saveletter">Save</button>${canc(cur)}</div>
 ${ls.map(l=>`<details class="c"><summary><b>${esc(l.title)}</b> <span class="mut">${l.date} · ${esc(l.by||"")}</span></summary><div style="white-space:pre-wrap;margin:10px 0">${esc(l.body)}</div>${rowBtn("letters",l.id)}</details>`).join("")||'<div class="c mut">No letters yet.</div>'}`}
function meetV(){const cur=L.meets.find(x=>x.id===ed)||{},t0=dayStart(TD()),up=L.meets.filter(m=>m.status!=="done").sort((a,b)=>a.date<b.date?-1:1),dn=L.meets.filter(m=>m.status==="done").sort((a,b)=>a.date<b.date?1:-1);
 const card=(m,u)=>`<div class="c"><b>${m.date}</b> ${esc(m.start||"")}${m.end?"–"+esc(m.end):""}<div>📍 ${esc(m.place||"—")}</div>${m.note?`<div class="mut">${esc(m.note)}</div>`:""}${u?`<div class="mut">${(n=>n>0?"⏳ In "+n+" days":n===0?"Today! 🎉":"Date passed")(diff(dayStart(m.date),t0))}</div><button class="b s" data-mmet="${m.id}">✔ We met</button>`:""}${rowBtn("meets",m.id)}</div>`;
 return `<h1 class="glow">Our meets</h1><div class="c"><h2>${cur.id?"Edit":"Plan"} a meet</h2><input id="ud" type="date" value="${esc(cur.date)}"><div class="r"><input id="us" type="time" value="${esc(cur.start)}"><input id="ue" type="time" value="${esc(cur.end)}"></div><input id="up" placeholder="Where?" value="${esc(cur.place)}"><input id="un" placeholder="Note / memories (optional)" value="${esc(cur.note)}"><button class="b" data-act="savemeet">Save</button>${canc(cur)}</div><h2>Upcoming</h2>${up.map(m=>card(m,1)).join("")||'<div class="c mut">Nothing planned.</div>'}<h2>Completed</h2>${dn.map(m=>card(m,0)).join("")||'<div class="c mut">None yet.</div>'}`}
// ==== events ====
document.addEventListener("change",async e=>{const t=e.target;
 if(t.dataset.task){const i=t.dataset.task,d=dayD();await save(TD(),{tasks:{...d.tasks,[i]:t.checked}});
  if(t.checked){const x=tasksFor(new Date()).find(a=>a[0]===i);post("শেষ করেছে: "+x[1].replace(/\s*\(.*\)$/,""))}}
 if(t.dataset.prep){me.prep[t.dataset.prep]=t.checked;await setDoc(doc(db,"users",U.uid),{prep:me.prep},{merge:true});render()}
 if(t.id==="flt"){flt=t.value;render()}
 if(t.id==="cat"){$("#art").style.display=t.value==="Noun"?"":"none"}});
document.addEventListener("click",async e=>{const t=e.target.closest("button,[data-mean],[data-goto]");if(!t||!U)return;const D=t.dataset;
 if(D.tab){document.activeElement?.blur();ed=null;if(D.tab==="chat"&&"Notification" in window&&Notification.permission==="default")Notification.requestPermission();nav(D.tab)}
 if(D.act==="out")signOut(auth);
 if(D.act==="norep"){replyTo=null;const rb=$("#rb");if(rb)rb.innerHTML=""}
 if(D.act==="theme"){theme=document.documentElement.dataset.th==="light"?"dark":"light";localStorage.setItem("th",theme);applyTheme();render(true)}
 if(D.th){theme=D.th;localStorage.setItem("th",theme);applyTheme();render(true)}
 if(D.act==="notif"){if("Notification" in window){const r=await enablePush();render(true);alert(r)}else alert("This browser does not support notifications.")}
 if(D.goto){const el=document.querySelector(`.msg[data-id="${D.goto}"]`);if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1300)}}
 if(D.act==="bk")backup();
 if(D.act==="rs")$("#bkf")?.click();
 if(D.dev){if(!confirm("Sign out that device?"))return;await updateDoc(doc(db,"users",U.uid,"devices",D.dev),{revoked:true}).catch(()=>{})}
 if(D.gs){gsub=D.gs;render(true)}
 if(D.act==="qzsub"){const a=$("#qa").value.trim(),g=$("#qg").value.trim();if(!a){alert("Write your answer first.");return}setDoc(doc(db,"qz",D.qid),{ans:{[U.uid]:a},gs:{[U.uid]:g}},{merge:true})}
 if(D.qk){const[id,v]=D.qk.split("|");setDoc(doc(db,"qz",id),{ok:{[U.uid]:v==="1"}},{merge:true})}
 if(D.act==="chal"){const on=!(days[TD()]?.chal);await save(TD(),{chal:on});if(on)post("completed today's challenge")}
 if(D.wg){if(D.wg==="start"){const pl=wgPool().sort(()=>Math.random()-.5).slice(0,5);wg={list:pl,i:0,score:0,msg:"",sc:scr(pl[0].de)}}
  else if(wg){const x=wg.list[wg.i];const nextW=()=>{wg.i++;wg.msg="";if(wg.i>=wg.list.length){save(TD(),{game:Math.max(days[TD()]?.game||0,wg.score)});post("scored "+wg.score+"/5 in Word Scramble")}else wg.sc=scr(wg.list[wg.i].de)};
   if(D.wg==="ans"){const v=($("#wgi")?.value||"").trim().toLowerCase();if(v===x.de.toLowerCase()){wg.score++;nextW()}else wg.msg="Not quite. Try again or skip."}
   if(D.wg==="skip"){const was=x.de;nextW();if(wg.i<wg.list.length)wg.msg="It was: "+was}}
  render(true)}
 if(D.rx){const id=D.sid,m=chat.find(x=>x.id===id);closeSheet();if(m){const cur=m.rx?.[U.uid];await updateDoc(doc(db,"chat",id),{["rx."+U.uid]:cur===D.rx?deleteField():D.rx}).catch(()=>{})}}
 if(D.act==="pwmail"){try{await sendPasswordResetEmail(auth,auth.currentUser.email);alert("Reset link sent to "+auth.currentUser.email+". Check your inbox and Spam folder.")}catch(e){alert("Could not send the email. Try again later.")}}
 if(D.act==="pwchg"){const c=$("#pwc").value,n=$("#pwn").value;if(!c||n.length<6){alert("Enter your current password and a new password (6+ characters).");return}try{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,c));await updatePassword(u,n);$("#pwc").value="";$("#pwn").value="";alert("Password changed.")}catch(e){alert(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"?"Current password is incorrect.":"Could not change the password. Try again.")}}
 if(D.act==="noedit"){editing=null;const rb=$("#rb");if(rb)rb.innerHTML="";const i=$("#cm");if(i){i.value="";draft=""}}
 if(D.sa){const id=D.sid,m=chat.find(x=>x.id===id);closeSheet();if(D.sa==="edit")startEdit(id);if(D.sa==="reply")rep(id);if(D.sa==="copy"&&m)try{await navigator.clipboard.writeText(m.text)}catch(e){}if(D.sa==="del"&&m&&confirm("Delete this message for everyone?"))await deleteDoc(doc(db,"chat",id))}
 if(D.act==="cancel"){ed=null;render(true)}
 if(D.act==="savename"){const n=$("#sn").value.trim();if(n){me.name=n;await setDoc(doc(db,"users",U.uid),{name:n},{merge:true});render(true)}}
 if(D.act==="savedate"){const title=$("#dt").value.trim(),date=$("#dd").value;if(!title||!date){alert("Title and date are required.");return}await saveDoc("dates",{title,date,cat:$("#dc").value,yearly:$("#dy").checked,desc:$("#dn").value.trim()});post("saved a date: "+title)}
 if(D.act==="savemem"){const title=$("#mt").value.trim(),date=$("#md").value,photo=$("#mp").value.trim();if(!title||!date){alert("Title and date are required.");return}if(photo&&!/^https:\/\//.test(photo)){alert("Photo link must start with https://");return}await saveDoc("mems",{title,date,photo,desc:$("#mn").value.trim()});post("added a memory: "+title)}
 if(D.act==="saveletter"){const title=$("#lt").value.trim(),body=$("#lb").value.trim();if(!title||!body){alert("Title and letter are required.");return}await saveDoc("letters",{title,date:$("#ld2").value||TD(),body});post("wrote a letter: "+title)}
 if(D.act==="savemeet"){const date=$("#ud").value;if(!date){alert("Date is required.");return}const old=L.meets.find(x=>x.id===ed);await saveDoc("meets",{date,start:$("#us").value,end:$("#ue").value,place:$("#up").value.trim(),note:$("#un").value.trim(),status:old?.status||"upcoming"});post("planned a meet: "+date)}
 if(D.ed){ed=D.ed;render(true)}
 if(D.rm){const[c,id]=D.rm.split(":");if(confirm("Delete this permanently?"))await deleteDoc(doc(db,c,id))}
 if(D.mmet){await updateDoc(doc(db,"meets",D.mmet),{status:"done",by:me.name});post("marked a meet as done 💕")}
 if(D.mv){memView=D.mv;render(true)}
 if(D.act==="send")send();
 if(D.act==="nudge"){await say("👋 আজকের শব্দগুলো করেছ? চলো একসাথে করি!");alert("পাঠানো হয়েছে, চ্যাটে দেখো।")}
 if(D.act==="install"&&deferred){deferred.prompt();deferred=null;render()}
 if(D.act==="csv"){const rows=[["Date","Category","Article","German","Plural","Bangla","English","Sentence"],...words.map(x=>[x.date,x.cat,x.art||"",x.de,x.pl||"",x.bn,x.en||"",x.ex||""])];
  const csv="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="my-german-words.csv";a.click()}
 if(D.say){const u=new SpeechSynthesisUtterance(D.say);u.lang="de-DE";speechSynthesis.speak(u)}
 if(D.g){const d=dayD(),has=(d.grammar||[]).includes(D.g),g=has?d.grammar.filter(x=>x!==D.g):[...(d.grammar||[]),D.g];await save(TD(),{grammar:g});if(!has)post("grammar শিখেছে: "+D.g)}
 if(D.del){await deleteDoc(doc(db,"users",U.uid,"words",D.del));await save(TD(),{wc:Math.max(0,(dayD().wc||1)-1)})}
 if(D.mean){showMean[D.mean]=!showMean[D.mean];render()}
 if(D.act==="add"){const de=$("#de").value.trim(),bn=$("#bn").value.trim(),cat=$("#cat").value;
  if(!de||!bn){$("#msg").textContent="German শব্দ আর বাংলা অর্থ দুটোই দাও।";return}
  if(words.some(x=>x.de.toLowerCase()===de.toLowerCase())){$("#msg").textContent="⚠️ এই শব্দ আগেই আছে।";return}
  if(words.filter(x=>x.date===TD()&&x.slot===$("#slot").value).length>=10&&!confirm("এই slot-এ ১০টা হয়ে গেছে। তবুও যোগ করবে?"))return;
  const g=id=>($("#"+id)?.value||"").trim();const w={de,bn,cat,en:g("en"),ex:g("ex"),exbn:g("exbn"),slot:$("#slot").value,date:TD(),wrong:false};
  if(cat==="Noun"){w.art=$("#art").value;w.pl=g("pl")}if(cat==="Verb"){w.pret=g("pret");w.pp=g("pp");w.aux=$("#aux").value}if(cat==="Adjective"){w.opp=g("opp");w.comp=g("comp");w.sup=g("sup")}if(cat==="Preposition")w.case=$("#case").value;
  Object.keys(w).forEach(k=>w[k]===""&&delete w[k]);
  await addDoc(collection(db,"users",U.uid,"words"),w);const n=(dayD().wc||0)+1;await save(TD(),{wc:n});
  if(n===20)post("আজকের ২০টা শব্দ শেষ করেছে 🎉")}
 if(D.q==="mean"||D.q==="art"){const from=ds(addD(new Date(),-7));let l=words.filter(x=>x.date>=from);if(D.q==="art")l=l.filter(x=>x.cat==="Noun"&&x.art);
  l=l.sort(()=>Math.random()-.5).slice(0,D.q==="art"?10:30);if(!l.length){alert("এই সময়ের শব্দ নেই।");return}quiz={mode:D.q,list:l,i:0,ok:0,show:false,pick:null};render()}
 if(D.q==="show"){quiz.show=true;render()}
 if(D.q==="next"){quiz.i++;quiz.pick=null;render();if(quiz.i>=quiz.list.length)finish()}
 if(D.q==="end"){quiz=null;render()}
 if(D.pick){if(quiz.pick)return;const x=quiz.list[quiz.i];quiz.pick=D.pick;if(D.pick===x.art)quiz.ok++;else await updateDoc(doc(db,"users",U.uid,"words",x.id),{wrong:true});render()}
 if(D.ans!==undefined&&quiz){const x=quiz.list[quiz.i];if(D.ans==="1")quiz.ok++;else await updateDoc(doc(db,"users",U.uid,"words",x.id),{wrong:true});quiz.i++;quiz.show=false;render();if(quiz.i>=quiz.list.length)finish()}
});
function finish(){post(`কুইজ দিয়েছে: ${quiz.ok}/${quiz.list.length} ঠিক`)}
</script></body></html>
