name: Build Our Life with PWABuilder (Bubblewrap TWA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ZIP encryption tool
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Build signed TWA and encrypted ZIP
        shell: bash
        env:
          BACKUP_PASSWORD: ${{ secrets.ZIP_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSWORD" || { echo "::error::Add ZIP_BACKUP_PASSWORD in repository Actions secrets first."; exit 1; }
          KEY_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KEY_PASS"
          mkdir -p output output_contents

          docker pull ghcr.io/googlechromelabs/bubblewrap:1.25.0

          docker run --rm \
            -e KEY_PASS="$KEY_PASS" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            --entrypoint /bin/sh \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            -c '
              set -eu
              cd /workspace/android-twa
              mkdir -p /workspace/output_contents

              keytool -genkeypair -v \
                -keystore android.keystore \
                -alias ourlife \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
                -dname "CN=Our Life, OU=Mobile App, O=Personal, L=Barishal, ST=Barishal, C=BD"

              SDKMANAGER="$(find /root/.bubblewrap/android_sdk -type f -name sdkmanager -print -quit)"
              test -n "$SDKMANAGER"
              yes | "$SDKMANAGER" --sdk_root=/root/.bubblewrap/android_sdk --licenses >/dev/null
              bubblewrap doctor || true
              bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

              export BUBBLEWRAP_KEYSTORE_PASSWORD="$KEY_PASS"
              export BUBBLEWRAP_KEY_PASSWORD="$KEY_PASS"
              bubblewrap build \
                --manifest=twa-manifest.json \
                --signingKeyPath=android.keystore \
                --signingKeyAlias=ourlife

              FP="$(keytool -list -v -keystore android.keystore -alias ourlife -storepass "$KEY_PASS" | sed -n "/SHA256:/s/.*SHA256: //p" | head -n 1)"
              test -n "$FP"

              cat > /workspace/output_contents/assetlinks.json <<EOF
              [
                {
                  "relation": ["delegate_permission/common.handle_all_urls"],
                  "target": {
                    "namespace": "android_app",
                    "package_name": "com.saimoon.ourlife",
                    "sha256_cert_fingerprints": ["$FP"]
                  }
                }
              ]
              EOF

              cat > /workspace/output_contents/signing-key-info.txt <<EOF
              App: Our Life
              Package ID: com.saimoon.ourlife
              Keystore file: android.keystore
              Key alias: ourlife
              Keystore password: $KEY_PASS
              Key password: $KEY_PASS

              Keep android.keystore and this file private.
              Use the same keystore and passwords for every future app update.
              EOF

              cp app-release-signed.apk /workspace/output_contents/Our-Life-PWABuilder.apk
              cp app-release-bundle.aab /workspace/output_contents/Our-Life-PWABuilder.aab
              cp android.keystore /workspace/output_contents/android.keystore
            '

          test -s output_contents/Our-Life-PWABuilder.apk
          test -s output_contents/android.keystore

          7z a -tzip -mem=AES256 -p"$BACKUP_PASSWORD" \
            output/Our-Life-PWABuilder-Signed.zip \
            ./output_contents/Our-Life-PWABuilder.apk \
            ./output_contents/Our-Life-PWABuilder.aab \
            ./output_contents/android.keystore \
            ./output_contents/signing-key-info.txt \
            ./output_contents/assetlinks.json

      - name: Upload password-protected APK and signing-key ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Our-Life-PWABuilder-Signed
          path: output/Our-Life-PWABuilder-Signed.zip
          if-no-files-found: error
          retention-days: 1
