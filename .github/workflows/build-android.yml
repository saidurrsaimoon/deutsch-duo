name: Build Our Life Android APK

on:
  push:
    paths:
      - '.github/workflows/build-android.yml'
      - 'android-app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install the exact Our Little Life drawing as launcher icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/saidurrsaimoon/deutsch-duo/main/icon-512.png -o android-app/app/src/main/res/drawable-nodpi/our_life_icon.png
          file android-app/app/src/main/res/drawable-nodpi/our_life_icon.png

      - name: Build signed debug APK
        run: gradle -p android-app assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Our-Life-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
